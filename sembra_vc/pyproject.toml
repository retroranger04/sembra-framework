[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sembra_vc"
version = "2.0.0"
description = "Fast surrogate for the equilibrium state and stability of an inflated dielectric elastomer membrane (voltage-controlled scenario)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Arpit Mathur" },
    { name = "Nirmal Kumar (BIT Mesra)" },
    { name = "Anirvan DasGupta (IIT Kharagpur)" },
]
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "sympy>=1.12,<2.0",
    "torch>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "pandas>=2.0,<3.0",
    "jupyter>=1.0,<2.0",
    "ipywidgets>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
include = ["sembra_vc*"]

[tool.setuptools.package-data]
sembra_vc = ["trained_models/*"]

[tool.pytest.ini_options]
testpaths = ["sembra_vc/tests"]
