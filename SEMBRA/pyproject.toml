[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sembra"
version = "0.1.0"
description = "Surrogate model for dielectric elastomer membrane Equilibrium, Stability, and Bifurcation Response Analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==3.0.3",
    "sympy==1.14.0",
    "torch==2.12.0",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "cloudpickle==3.1.2",
    "jupyter==1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "black==26.5.1",
    "ruff==0.15.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sembra*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []
